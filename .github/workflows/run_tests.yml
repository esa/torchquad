# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Running tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff==0.14.6 pydoclint==0.8.3
      - name: Check formatting with ruff
        run: ruff format --check .
      - name: Lint with ruff
        run: ruff check --output-format=github .
      - name: Check docstrings with pydoclint
        run: pydoclint torchquad/

  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Search for severe code errors with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          pip install ruff==0.14.6
          ruff check --select=E9,F63,F7,F82 --output-format=github .
      - name: provision-with-micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment_all_backends.yml
          environment-name: torchquad
          cache-downloads: true
      - name: Test with pytest
        shell: bash -l {0}
        run: |
          micromamba activate torchquad
          pip install -e .
          cd tests/
          pip install pytest
          pip install pytest-error-for-skips
          pip install pytest-cov
          pytest -ra --error-for-skips --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=../torchquad . | tee pytest-coverage.txt
      - name: pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          pytest-coverage-path: ./tests/pytest-coverage.txt
          title: Coverage Report
          badge-title: Overall Coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false
          hide-comment: false
          report-only-changed-files: false
          junitxml-path: ./tests/pytest.xml
