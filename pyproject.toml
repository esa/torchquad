[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchquad"
version = "0.5.0"
description = "Package providing numerical integration methods for PyTorch, jax, TensorFlow and numpy."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8, <4"
license = { text = "GPL-3.0" }
authors = [
    { name = "ESA Advanced Concepts Team", email = "pablo.gomez@esa.int" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "loguru>=0.5.3",
    "matplotlib>=3.3.3",
    "scipy>=1.6.0",
    "tqdm>=4.56.1",
    "autoray>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/esa/torchquad"
Source = "https://github.com/esa/torchquad/"

[tool.setuptools]
packages = ["torchquad", "torchquad.integration", "torchquad.utils"]

[tool.ruff]
line-length = 100
extend-exclude = ["my_notebooks", "build", "dist"]

[tool.ruff.lint]
# The default selection (E4/E7/E9/F) already covers the severe-error gate
# (E9, F63, F7, F82) that flake8 enforced. These three are intentionally
# relaxed, matching the retired .flake8 config:
#   E402 - numerical backends are imported lazily, not at top of file
#   E501 - line length is handled by the formatter, not the linter
#   E203 - conflicts with the formatter's slice-spacing style
ignore = ["E203", "E402", "E501"]

[tool.pydoclint]
style = "google"
# Signature type hints are deferred to the 0.7 typing pass (roadmap R9);
# docstrings carry the types for now, so only check docstring completeness
# and consistency (missing Args/Returns/Raises), not signature annotations.
arg-type-hints-in-signature = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = true

[tool.vulture]
paths = ["torchquad"]
# The blocking CI tier runs at 100% confidence; a 60% advisory tier runs
# non-blocking. Symbols used implicitly (autoray registrations, API hooks)
# that vulture cannot see belong in .vulture_whitelist.py, but prefer
# deleting dead code over whitelisting it.
min_confidence = 100

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:torchquad.integration.utils:256",                                       # Our own deprecation warning
    "ignore:torch.meshgrid:UserWarning",                                                         # PyTorch meshgrid warning 
    "ignore:Explicitly requested dtype.*truncated:UserWarning",                                  # JAX dtype warnings
    "ignore:In the next release:UserWarning",                                                    # TensorFlow warnings
    "ignore:DEPRECATION WARNING.*In future versions of torchquad:UserWarning",                   # Our deprecation warnings in TF autograph
    "ignore:integration_domain should be a list:RuntimeWarning",                                 # Intentional warning for conflicting backend arguments
    "ignore:To copy construct from a tensor.*recommended to use sourceTensor.clone:UserWarning", # PyTorch tensor copy warnings
    "ignore:Cannot update the VEGASMap.*integrand which evaluates to zero:RuntimeWarning",       # VEGAS warning for zero integrands
]
