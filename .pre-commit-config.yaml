# Pre-commit hooks for torchquad.
#
# Install once with:  pip install pre-commit && pre-commit install
# Run on all files:   pre-commit run --all-files
#
# These mirror the CI gates so issues are caught before pushing.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      # Run the linter (with --fix) before the formatter, per the ruff-pre-commit
      # recommendation, so the hook set converges in a single pass.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.8.3
    hooks:
      - id: pydoclint
        args: [--style=google]
        files: ^torchquad/
